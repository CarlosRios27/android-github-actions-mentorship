name: Hola mundo workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
    - main

jobs:
  crear-archivo:
   name: Crear archivo txt
   runs-on: ubuntu-latest
   
   steps:
    - name: Crear Hola Mundo.txt
      run: echo "Hola mundo" > hola-mundo.txt
    
    - name: Guardar archivo como artifact
      uses: actions/upload-artifact@v4
      with:
        name: archivo-hola-mundo
        path: hola-mundo.txt
    
  leer-archivo:
    name: Leer archivo txt
    runs-on: ubuntu-latest
    needs: crear-archivo
    
    steps:
    - name: Descargar artifact
      uses: actions/download-artifact@v4
      with:
        name: archivo-hola-mundo
    
    - name: Imprimir contenido del archivo
      run: cat hola-mundo.txt
