name: 'Pull Request'

on:
  # Run on pull requests targeting master or develop
  pull_request:
    branches:
      - master

  # Also allow manual runs from the Actions tab
  workflow_dispatch:
      
# Store variables that will be used throughout the entire workflow
env:
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION }}
  JAVA_VERSION: ${{ secrets.JAVA_VERSION }}
  
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Android Environment
        uses: ./.github/actions/composite/setup-android
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Execute unit tests
        run: ./gradlew test

      - name: Add Build Summary
        run: |
          echo "## ✅ Tests Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: Passed" >> $GITHUB_STEP_SUMMARY
