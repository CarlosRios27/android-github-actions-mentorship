name: 'Push Validation'

on:
  # Run on push targeting main or develop
  push:
    branches:
      - main
      - develop

  # Also allow manual runs from the Actions tab
  workflow_dispatch:
      
# Store variables that will be used throughout the entire workflow
env:
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '17'
  
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Android Environment
        uses: ./.github/actions/composite/setup-android
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Execute unit tests
        run: ./gradlew test

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Android Environment
        uses: ./.github/actions/composite/setup-android
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DISTRIBUTION }}

      # Code analysis check to catch potential bugs, style issues, and other problems
      - name: Run Lint check
        run: ./gradlew lintDebug

      - name: Execute build
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add Build Summary
        run: |
          echo "## ✅ Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Build: Successful" >> $GITHUB_STEP_SUMMARY
          echo "- APK artifact uploaded to GitHub Actions artifacts." >> $GITHUB_STEP_SUMMARY
